ieza.');const r=await sb.storage.from('audit-evidencias').remove([PATH]);if(r.error)throw r.error;msg.className='ok';msg.textContent='Limpieza completada. La evidencia privada de prueba fue eliminada y Auditoría IT queda lista para operación real.';back.style.display='inline-block'})().catch(e=>{msg.className='bad';msg.textContent='No se pudo completar: '+(e.message||e);back.style.display='inline-block'});</script></body></html>
