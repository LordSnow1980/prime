name: Activar PDV mayúsculas

on:
  push:
    paths:
      - '.github/trigger-pdv-uppercase.txt'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Activar normalizador de PDV
        shell: python
        run: |
          from pathlib import Path
          p=Path('adquisicion/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./pdv-uppercase-v1.js?v=2a1c49cd"></script>'
          if tag not in s:
              pos=s.lower().rfind('</body>')
              if pos < 0: raise RuntimeError('No se encontró </body>')
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
      - name: Commit y push
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "PRIME MX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add adquisicion/index.html
          git commit -m "Adquisición: activa homologación PDV mayúsculas"
          git push origin HEAD:main
