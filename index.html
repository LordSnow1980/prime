<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Biométricos y Pinpads — PrimeMX v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1A18; --ink2:#16241F; --ink3:#22332C;
  --paper:#F2F4F1; --panel:#FFFFFF; --panel2:#FAFBF9;
  --line:#E4E8E2; --line2:#CFD6CE; --text:#16211D; --muted:#66756E;
  --pine:#0E6B52; --pine2:#0A5540; --pine-soft:#E4F2EC; --pine-line:#96C9B6;
  --ochre:#A05505; --ochre-soft:#FDF0DF; --ochre-line:#EBBE86;
  --steel:#3D5460; --steel-soft:#E9EFF1; --steel-line:#B0C2C9;
  --alert:#8E2230; --alert-soft:#FBE9EA; --alert-line:#E3AEB4;
  --plum:#6B3A6E; --plum-soft:#F5EDF5; --plum-line:#D5BBD6;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --r2:7px;
  --sh1:0 1px 2px rgba(15,26,24,.05);
  --sh2:0 1px 3px rgba(15,26,24,.06),0 8px 22px -6px rgba(15,26,24,.10);
  --sh3:0 20px 50px -12px rgba(15,26,24,.32);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C7CFC8;border-radius:8px;border:3px solid var(--paper);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#AAB5AC;background-clip:padding-box;border:3px solid var(--paper)}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
.app{display:none;min-height:100vh}
.app.ready{display:flex}
.authgate{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 18% 14%,#24473B 0,transparent 31%),linear-gradient(145deg,#0F1A18,#07100D)}
.authgate.hidden{display:none}
.authcard{width:min(430px,100%);background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.2);border-radius:16px;
  padding:30px;box-shadow:0 28px 80px rgba(0,0,0,.38)}
.authbrand{font-size:29px;letter-spacing:-.04em;font-weight:800;margin-bottom:4px}.authbrand i{font-style:normal;font-weight:400}
.authcard h1{font-size:20px;margin:22px 0 5px}.authcard>p{color:var(--muted);margin:0 0 20px}
.authmsg{min-height:20px;margin-top:12px;font-size:12px;color:var(--muted)}.authmsg.err{color:var(--alert)}
.authactions{display:flex;gap:8px;margin-top:6px}.authactions .btn{justify-content:center;flex:1;padding:10px}
.userbox{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid var(--line)}
.userpill{font-size:11px;line-height:1.25;text-align:right;max-width:210px}.userpill b{display:block;overflow:hidden;text-overflow:ellipsis}
.userpill span{color:var(--muted);font-size:10px;text-transform:capitalize}
.readonly-note{background:var(--ochre-soft);color:var(--ochre);border:1px solid var(--ochre-line);padding:7px 10px;border-radius:7px;font-size:11px}
.rail{width:232px;flex:0 0 232px;background:linear-gradient(175deg,var(--ink3) 0%,var(--ink) 46%,#0A1412 100%);
  color:#D6E2DC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 15px}
.brand .logo{display:block;width:132px;height:auto;opacity:.97}
.brand .sub{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,.09)}
.brand .dot{width:7px;height:7px;border-radius:50%;background:#00A3E0;box-shadow:0 0 0 3px rgba(0,163,224,.2);flex:none}
.brand .sub span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#839990;font-weight:600}
.modal .logo{height:17px;width:auto;opacity:.9}
.nav{padding:6px 10px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#AFC0B8;
  padding:8px 10px;border-radius:var(--r2);cursor:pointer;font-size:13px;margin-bottom:1px;transition:background .12s,color .12s}
.nav button svg{flex:0 0 15px;opacity:.75}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(90deg,var(--pine),#0C7C5E);color:#fff;font-weight:600;box-shadow:0 3px 12px -4px rgba(14,107,82,.9)}
.nav button.on svg{opacity:1}
.nav .tag{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:500;background:rgba(255,255,255,.07);
  color:#93A9A0;padding:2px 7px;border-radius:20px;letter-spacing:-.02em}
.nav button.on .tag{background:rgba(255,255,255,.2);color:#fff}
.nav .sect{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5B6E66;padding:16px 10px 7px;font-weight:700}
.railfoot{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.railfoot button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#D6E2DC;border-radius:var(--r2);
  padding:8px;cursor:pointer;width:100%;font-size:12px;font-weight:500;transition:.12s}
.railfoot button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.24);color:#fff}
.railfoot div{margin-top:9px;font-size:10.5px;color:#6F827A;display:flex;align-items:center;gap:6px}
.railfoot div:before{content:"";width:6px;height:6px;border-radius:50%;background:#3FBF95;flex:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:16px 26px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.topbar h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em}
.topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrap{padding:20px 26px 70px;flex:1;max-width:1560px;width:100%}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);
  padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;box-shadow:var(--sh1);transition:.12s}
.btn:hover{border-color:#9FAEA4;box-shadow:var(--sh2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.pri{background:linear-gradient(180deg,#12775B,var(--pine));border-color:var(--pine2);color:#fff;box-shadow:0 2px 8px -2px rgba(14,107,82,.5)}
.btn.pri:hover{background:linear-gradient(180deg,#148566,#0C6047);border-color:var(--pine2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:var(--ink3);border-color:var(--ink3)}
.btn.danger{color:var(--alert);border-color:var(--alert-line);background:#fff}
.btn.danger:hover{background:var(--alert-soft);border-color:#CE8F97}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.inp,select.inp{background:#fff;border:1px solid var(--line2);border-radius:var(--r2);padding:8px 10px;width:100%;transition:.12s;box-shadow:var(--sh1)}
.inp:hover{border-color:#B4BFB6}
.inp:focus,select.inp:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(14,107,82,.13)}
textarea.inp{line-height:1.6;font-family:var(--mono);font-size:12px}
label.f{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:700}
.field{margin-bottom:13px}
.row{display:flex;gap:11px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}

/* ---------- Filtros ---------- */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;margin-bottom:14px;box-shadow:var(--sh1)}
.filters .search{flex:1 1 250px;min-width:200px;position:relative}
.filters .search .inp{padding-left:32px}
.filters .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
.chipset{display:flex;gap:3px;background:var(--paper);padding:3px;border-radius:var(--r2);border:1px solid var(--line)}
.chipset button{border:0;background:none;padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500;transition:.12s}
.chipset button:hover{color:var(--text)}
.chipset button.on{background:#fff;color:var(--pine);font-weight:600;box-shadow:var(--sh1)}
select.mini{background:#fff;border:1px solid var(--line2);border-radius:var(--r2);padding:7px 9px;font-size:12.5px;max-width:190px;box-shadow:var(--sh1)}
select.mini:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(14,107,82,.13)}

/* ---------- Tabla ---------- */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 262px);box-shadow:var(--sh2)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:linear-gradient(180deg,#FBFCFA,#F1F4F0);border-bottom:1px solid var(--line2);
  text-align:left;padding:9px 11px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#5A6B63;font-weight:700;white-space:nowrap;z-index:5}
tbody td{border-bottom:1px solid #F0F3EF;padding:8px 11px;vertical-align:middle;white-space:nowrap}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tbody tr.sel{background:var(--pine-soft)}
tbody tr.sel:hover{background:#DAEDE4}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pine)}
td.serie{font-family:var(--mono);font-size:11px;letter-spacing:-.03em;color:#2A3B34}
td.wrapcell{white-space:normal;min-width:175px;max-width:290px;line-height:1.4}
.ck{width:15px;height:15px;accent-color:#0E6B52;cursor:pointer;vertical-align:middle}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15.5px;margin-bottom:5px;font-weight:600}

/* ---------- Insignias ---------- */
.b{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;
  letter-spacing:.02em;white-space:nowrap;border:1px solid}
.b:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b.ok{background:var(--pine-soft);color:var(--pine);border-color:var(--pine-line)}
.b.pend{background:var(--ochre-soft);color:var(--ochre);border-color:var(--ochre-line)}
.b.del{background:var(--steel-soft);color:var(--steel);border-color:var(--steel-line)}
.b.n{background:#F1F4F0;color:#5C6B63;border-color:var(--line2)}
.b.n:before{display:none}
.tipo{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.07em;padding:3px 7px;border-radius:5px;border:1px solid}
.tipo.bio{background:var(--steel-soft);color:var(--steel);border-color:var(--steel-line)}
.tipo.pin{background:var(--plum-soft);color:var(--plum);border-color:var(--plum-line)}

/* ---------- Barra de selección ---------- */
.selbar{position:sticky;bottom:16px;margin-top:14px;background:linear-gradient(180deg,var(--ink3),var(--ink));color:#fff;
  border-radius:12px;padding:11px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--sh3);z-index:20;
  animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.selbar .n{font-family:var(--mono);font-size:17px;font-weight:600;color:#54D3A6}
.selbar .lbl{color:#9FB4AB;font-size:12px}
.selbar .sp{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.selbar .btn{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.selbar .btn:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.3)}
.selbar .btn.pri{background:linear-gradient(180deg,#14A37B,#0E8865);border-color:#0B7355}
.selbar .btn.pri:hover{background:linear-gradient(180deg,#17B489,#10906B)}

/* ---------- Tarjetas ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 14px;position:relative;
  overflow:hidden;box-shadow:var(--sh1);transition:.15s}
.kpi:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.kpi.a:before{background:linear-gradient(180deg,#C9760F,var(--ochre))}
.kpi.b:before{background:linear-gradient(180deg,#16906E,var(--pine))}
.kpi.c:before{background:linear-gradient(180deg,#57727F,var(--steel))}
.kpi.d:before{background:linear-gradient(180deg,#AE2F3E,var(--alert))}
.kpi .lab{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .val{font-size:34px;font-weight:700;line-height:1;margin:9px 0 4px;letter-spacing:-.035em;font-family:var(--mono)}
.kpi .sub{font-size:11.5px;color:var(--muted);line-height:1.4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh1)}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.card .cs{margin:0 0 13px;font-size:11.5px;color:var(--muted);line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;align-items:start}

/* ---------- Cinta de inventario ---------- */
.ribbon{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:12px 0 10px;background:#EDF0EC;box-shadow:inset 0 1px 3px rgba(0,0,0,.07)}
.ribbon div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;
  font-family:var(--mono);min-width:2px;transition:flex .45s cubic-bezier(.4,0,.2,1);letter-spacing:-.02em}
.rlegend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.rlegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mtable{width:100%;font-size:12.5px}
.mtable td{padding:7px 4px;border-bottom:1px solid #F2F4F1;line-height:1.35}
.mtable tr:last-child td{border-bottom:0}
.mtable td:last-child{text-align:right;font-family:var(--mono);font-weight:600;letter-spacing:-.02em;white-space:nowrap;padding-left:10px}
.bar{height:5px;background:#EDF0EC;border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#17A07A,var(--pine));border-radius:4px;transition:width .45s}

/* ---------- Comprobantes ---------- */
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:14px}
.cmp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;
  box-shadow:var(--sh1);transition:.15s;cursor:pointer;min-height:132px}
.cmp:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:var(--line2)}
.cmp .info{flex:1;min-width:0;padding:14px 15px;display:flex;flex-direction:column;gap:5px}
.cmp .nom{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.cmp .meta{font-size:11.5px;color:var(--muted);line-height:1.5}
.cmp .meta b{color:var(--text);font-weight:600}
.cmp .pie{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:6px}
.cmp .foto{flex:0 0 132px;background:#EEF1ED center/cover no-repeat;border-left:1px solid var(--line);position:relative}
.cmp .foto.vacia{display:flex;align-items:center;justify-content:center;color:#A7B3AB;font-size:10.5px;text-align:center;padding:8px;line-height:1.4}
.cmp .foto .mas{position:absolute;right:6px;bottom:6px;background:rgba(15,26,24,.8);color:#fff;font-size:10px;
  padding:2px 7px;border-radius:20px;font-family:var(--mono)}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:22px 16px;text-align:center;background:var(--panel2);
  cursor:pointer;transition:.14s}
.drop:hover,.drop.over{border-color:var(--pine);background:var(--pine-soft)}
.drop b{display:block;font-size:13px;margin-bottom:3px}
.drop span{font-size:11.5px;color:var(--muted)}
.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);background:#EEF1ED center/cover}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(15,26,24,.82);color:#fff;border:0;border-radius:50%;
  width:20px;height:20px;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.thumb button:hover{background:var(--alert)}
.visor{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}
.visor .fotos{display:flex;flex-direction:column;gap:10px}
.visor img{width:100%;border-radius:9px;border:1px solid var(--line2);display:block;background:#EEF1ED}
@media(max-width:760px){.visor{grid-template-columns:1fr}}

/* ---------- Modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(11,20,18,.5);display:flex;align-items:flex-start;justify-content:center;
  padding:32px 16px;z-index:100;overflow:auto;backdrop-filter:blur(3px);animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:790px;box-shadow:0 30px 70px -15px rgba(0,0,0,.4);
  overflow:hidden;animation:pop .19s cubic-bezier(.2,.8,.3,1)}
.modal.wide{max-width:1020px}
@keyframes pop{from{transform:translateY(14px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.mhead{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#FBFCFA,#F5F7F4)}
.mhead h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.015em}
.mhead p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}
.mhead .x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);
  padding:4px 8px;border-radius:6px;align-self:flex-start}
.mhead .x:hover{background:rgba(0,0,0,.06);color:var(--text)}
.mbody{padding:20px 22px;max-height:64vh;overflow:auto}
.mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;background:var(--panel2)}
.mfoot .sp{margin-left:auto;display:flex;gap:9px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5}
.warnbox,.okbox{padding:11px 13px;border-radius:var(--r2);font-size:12px;margin-bottom:13px;line-height:1.5;border:1px solid}
.warnbox{background:var(--ochre-soft);border-color:var(--ochre-line);color:#734008}
.okbox{background:var(--pine-soft);border-color:var(--pine-line);color:#0A4A39}

.radios{display:flex;gap:9px;flex-wrap:wrap}
.radios label{flex:1;min-width:140px;border:1px solid var(--line2);border-radius:var(--r2);padding:10px 12px;cursor:pointer;background:#fff;transition:.13s;box-shadow:var(--sh1)}
.radios label:hover{border-color:#A6B6AC}
.radios label.on{border-color:var(--pine);background:var(--pine-soft);box-shadow:0 0 0 1px var(--pine),var(--sh1)}
.radios b{display:block;font-size:12.5px;font-weight:600}
.radios span{font-size:11px;color:var(--muted);line-height:1.4}
.radios input{display:none}

.combo{position:relative}
.combo .list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line2);
  border-radius:var(--r2);box-shadow:var(--sh3);max-height:270px;overflow:auto;z-index:60;padding:4px}
.combo .list div{padding:8px 10px;cursor:pointer;border-radius:6px}
.combo .list div:hover,.combo .list div.hi{background:var(--pine-soft)}
.combo .list b{display:block;font-size:12.5px;font-weight:600}
.combo .list span{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:-.02em}
.picked{background:var(--pine-soft);border:1px solid var(--pine-line);border-radius:var(--r2);padding:10px 13px;display:flex;align-items:center;gap:10px}
.picked b{font-size:13px} .picked span{font-size:11px;color:#3A6E5D;display:block;margin-top:1px}
.picked button{margin-left:auto;background:#fff;border:1px solid var(--pine-line);color:var(--pine);cursor:pointer;
  font-size:11.5px;border-radius:6px;padding:5px 10px;font-weight:500}
.picked button:hover{background:var(--pine);color:#fff;border-color:var(--pine)}

.itable{width:100%;font-size:12px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;border-collapse:separate;border-spacing:0}
.itable th{background:#F3F5F2;text-align:left;padding:7px 9px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#5A6B63;font-weight:700}
.itable td{padding:6px 9px;border-top:1px solid #F0F3EF}
.itable input{width:100%;border:1px solid var(--line2);border-radius:5px;padding:5px 8px;font-size:12px}
.itable input:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 2px rgba(14,107,82,.13)}
.itable .sn{font-family:var(--mono);font-size:11px;letter-spacing:-.03em}

.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:11px 15px;border-radius:9px;font-size:12.5px;box-shadow:var(--sh3);

.toast.err{background:var(--alert);border-left-color:#F0A6AE}
.pager{display:flex;align-items:center;gap:9px;padding:11px 3px;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* ============================================================
   ALMACENAMIENTO LOCAL COMPATIBLE
   Edge/Chrome no incluyen window.storage al abrir un HTML desde disco.
   Este adaptador conserva inventario, respaldos y fotos en IndexedDB.
   ============================================================ */
(function(){
  if(window.storage && typeof window.storage.get==='function' &&
     typeof window.storage.set==='function' && typeof window.storage.delete==='function') return;

  const DB_NAME='primemx_biometricos_pinpads';
  const STORE_NAME='archivos';
  let dbPromise=null;

  function abrirDB(){
    if(dbPromise) return dbPromise;
    dbPromise=new Promise((resolve,reject)=>{
      if(!window.indexedDB){ reject(new Error('IndexedDB no disponible')); return; }
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('No se pudo abrir el almacenamiento'));
      req.onblocked=()=>reject(new Error('El almacenamiento está bloqueado por otra pestaña'));
    });
    return dbPromise;
  }

  async function operar(modo, accion){
    const db=await abrirDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_NAME,modo);
      const st=tx.objectStore(STORE_NAME);
      let req;
      try{ req=accion(st); }
      catch(e){ reject(e); return; }
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||tx.error||new Error('Error de almacenamiento'));
      tx.onabort=()=>reject(tx.error||new Error('Operación cancelada'));
    });
  }

  window.storage={
    async get(key){
      const value=await operar('readonly',st=>st.get(String(key)));
      return typeof value==='undefined' ? null : {value:value};
    },
    async set(key,value){
      await operar('readwrite',st=>st.put(value,String(key)));
      return {value:value};
    },
    async delete(key){
      await operar('readwrite',st=>st.delete(String(key)));
      return true;
    }
  };
})();

    logIt('Homologación automática: '+nl+' registro(s) quedaron como LOTE + número.','SISTEMA');
    save();
  }
}
function migrate(){
  const v = DB.sv||1;
  if(v >= SEED_V) return;
  let notas = [];

  if(v < 2){   // alta complementaria de series
    const have = new Set(DB.rec.map(r=>r.s).concat(DB.ent.map(r=>r.s)));
    let add = 0;
    SEED.rec.filter(r=>r.v===2).forEach(r=>{
      if(have.has(r.s)) return;
      have.add(r.s); add++;
      const c = Object.assign({}, r); c.i = nid('R', DB.rec); DB.rec.push(c);
    });
    if(add) notas.push('se agregaron '+add+' biométricos MSO331 de la alta complementaria');
  }

  if(v < 3){   // corrección de estatus y de PDV de origen en blanco
    const byS = {}; DB.rec.forEach(r=>{ if(!byS[r.s]) byS[r.s]=r; });
    let f = 0;
    (SEED.fix3||[]).forEach(x=>{
      const r = byS[x.s];
      if(r && r.e==='PENDIENTE' && !r.k && !r.c && !r.p){   // solo lo que no has tocado
        r.e='ASIGNADO'; r.p=x.p; r.c=x.c||''; r.k=x.k||''; r.a=x.a||'REEMPLAZO'; f++;
      }
    });
    if(f) notas.push(f+' equipo(s) pasaron a asignados por corrección de estatus');
    const byE = {}; DB.ent.forEach(r=>{ if(!byE[r.s]) byE[r.s]=r; });
    let g = 0;
    (SEED.fixEnt3||[]).forEach(s=>{ const r=byE[s]; if(r && !r.p){ r.p='RECOLECCION BIOMETRICO SOBRANTE'; g++; } });
    if(g) notas.push(g+' registro(s) sin PDV quedaron como Recolección biométrico sobrante');
  }

  if(v < 4){   // el lote de las 17 series pasa a Lote 18, expansión, recibidas el 17/08/2026
    const byS = {}; DB.rec.forEach(r=>{ if(!byS[r.s]) byS[r.s]=r; });
    let h = 0;
    (SEED.fix4||[]).forEach(x=>{
      const r = byS[x];
      if(r && r.l==='ALTA COMPLEMENTARIA'){                       // solo si no lo has cambiado tú
        r.l='LOTE 18'; r.f='2026-08-17';
        if(!r.n || r.n==='Alta capturada el 18/08/2026') r.n='Expansión';
        h++;
      }
    });
    if(h) notas.push(h+' equipo(s) quedaron en el Lote 18, expansión, con recepción del 17/08/2026');
  }

  if(v < 5){   // el archivo fuente se actualizó: una serie vive en una sola hoja
    const enEnt = new Set(SEED.ent.map(r=>r.s));
    const salieron = DB.rec.filter(r=>enEnt.has(r.s));
    if(salieron.length){
      DB.rec = DB.rec.filter(r=>!enEnt.has(r.s));
      notas.push(salieron.length+' equipo(s) salieron del inventario porque ya aparecen entregados a AT&T');
    }
    const hayEnt = new Set(DB.ent.map(r=>r.s));
    let ne = 0;
    SEED.ent.forEach(r=>{ if(!hayEnt.has(r.s)){ const c=Object.assign({},r); c.i=nid('E',DB.ent); DB.ent.push(c); ne++; } });
    if(ne) notas.push(ne+' salida(s) hacia AT&T agregadas del archivo');
    const hayRec = new Set(DB.rec.map(r=>r.s));
    let nr = 0;
    SEED.rec.forEach(r=>{ if(!hayRec.has(r.s) && !enEnt.has(r.s)){ const c=Object.assign({},r); c.i=nid('R',DB.rec); DB.rec.push(c); nr++; } });
    if(nr) notas.push(nr+' equipo(s) recibidos agregados del archivo');
    DB.ent.forEach(r=>{ if(!r.p){ const s=SEED.ent.find(x=>x.s===r.s); if(s&&s.p) r.p=s.p, r.c=s.c||r.c; } });
  }

  if(v < 7){   // todos los lotes usan el formato LOTE + número
    const nl=normalizarDBLotes(DB);
    if(nl) notas.push(nl+' registro(s) de lote quedaron homologados como LOTE + número');
  }

  DB.sv = SEED_V;
  if(notas.length) logIt('Actualización de datos: '+notas.join('; ')+'.', 'SISTEMA');
  save();
}

  DB = { sv:SEED_V, rec: SEED.rec.map(x=>Object.assign({},x)), ent: SEED.ent.map(x=>Object.assign({},x)), log: [], cmp: [] };

let saveT=null;
var saveRevision=0;
function canWrite(){ return !!(APP_PROFILE && APP_PROFILE.activo && (APP_PROFILE.role==='ADMIN' || APP_PROFILE.role==='CAPTURA')); }
function save(){
  if(!canWrite()){
    toast('Tu perfil es de consulta; no puede modificar la base.',true);
    return;
  }
  dirty=true; changes++; setSaveState();
  saveRevision++;
  clearTimeout(saveT);
  saveT=setTimeout(flushSave, 450);
}
async function flushSave(){
  if(saving){ clearTimeout(saveT); saveT=setTimeout(flushSave,250); return; }
  const revision=saveRevision;
  const payload=JSON.parse(JSON.stringify(DB));
  saving=true; setSaveState();
  try{
    await window.storage.set(KEY, JSON.stringify(payload));
    const r=await CENTRAL.rpc('save_app_state',{p_data:payload,p_expected_version:SERVER_VERSION});
    if(r.error) throw r.error;
    const row=Array.isArray(r.data)?r.data[0]:r.data;
    SERVER_VERSION=Number((row&&row.new_version)||SERVER_VERSION+1);
    if(saveRevision===revision) dirty=false;
    storageOK=true; centralConflict=false;
  }catch(e){
    const msg=String((e&&e.message)||e||'');
    storageOK=false;
    if(msg.indexOf('VERSION_CONFLICT')>=0){
      centralConflict=true;
      toast('Otra persona guardó cambios antes. Recarga para ver la versión central; no se sobrescribió nada.',true);
    }else toast('No se pudo sincronizar. Tus cambios permanecen en este navegador; intenta de nuevo.',true);
  }
  saving=false; setSaveState();
  if(dirty && !centralConflict && saveRevision!==revision){ clearTimeout(saveT); saveT=setTimeout(flushSave,250); }
  autoBackup();
}
function setSaveState(){
  const el=$('#saveState'); if(!el) return;
  el.textContent = centralConflict ? 'Conflicto: recarga la base' : !storageOK ? 'Sin conexión central' : saving ? 'Sincronizando…' : dirty ? 'Cambios sin sincronizar' : 'Base central sincronizada';
  el.style.color = storageOK? '' : '#E0A05A';
}

/* ---------- respaldos ---------- */
const MAX_AUTO = 5, MAX_MAN = 10, BK_MIN_MS = 10*60*1000, BK_MIN_CH = 20;
function autoBackup(){
  const now = Date.now();
  if(changes >= BK_MIN_CH || (changes > 0 && now - lastBk > BK_MIN_MS)) makeBackup('auto');
}
async function makeBackup(tipo, nota){
  const now = new Date();
  const key = 'pmx_bk_' + now.getTime();
  const payload = JSON.stringify({d:now.toISOString(), tipo:tipo, nota:nota||'', sv:DB.sv, rec:DB.rec, ent:DB.ent, log:DB.log, cmp:DB.cmp||[]});
  try{
    await window.storage.set(key, payload);
    BK.unshift({k:key, d:now.toISOString(), tipo:tipo, nota:nota||'', rec:DB.rec.length, ent:DB.ent.length, cmp:(DB.cmp||[]).length, kb:Math.round(payload.length/1024)});
    const keep = [], drop = [];
    let a=0, m=0;
    BK.forEach(b=>{
      if(b.tipo==='manual'){ (m++ < MAX_MAN ? keep : drop).push(b); }
      else { (a++ < MAX_AUTO ? keep : drop).push(b); }
    });
    BK = keep;
    for(const b of drop){ try{ await window.storage.delete(b.k); }catch(e){} }
    await window.storage.set(BK_IDX, JSON.stringify(BK));
    changes = 0; lastBk = now.getTime();
    if(tipo==='manual'){ logIt('Respaldo manual creado'+(nota?' ('+nota+')':'')+'.', 'RESPALDO'); save(); }
    return true;
  }catch(e){
    if(tipo==='manual') toast('No se pudo crear el respaldo en el navegador. Usa la descarga en archivo.', true);
    return false;
  }
}
async function restoreBackup(k){
  try{
    const r = await window.storage.get(k);
    const b = JSON.parse(r.value);
    await makeBackup('manual', 'Antes de restaurar');
    DB = {sv:b.sv||SEED_V, rec:b.rec, ent:b.ent, log:b.log||[], cmp:b.cmp||[]};
    logIt('Datos restaurados desde el respaldo del '+new Date(b.d).toLocaleString('es-MX')+'.', 'RESPALDO');
    S.sel.clear(); S.esel.clear(); save(); render();
    toast('Respaldo restaurado');
  }catch(e){ toast('No se pudo leer ese respaldo', true); }
}
async function deleteBackup(k){
  try{ await window.storage.delete(k); }catch(e){}
  BK = BK.filter(b=>b.k!==k);
  try{ await window.storage.set(BK_IDX, JSON.stringify(BK)); }catch(e){}
  render();
}

/* ---------- sugerencia de PDV por nombre ---------- */
const M_STOP={PRM:1,TDA:1,PLAZA:1,DE:1,LA:1,EL:1,LOS:1,LAS:1,DEL:1};
const M_SYN={QRO:'QUERETARO',MTY:'MONTERREY',GDL:'GUADALAJARA',GLA:'GUADALAJARA',CVA:'CUERNAVACA',
 XAL:'XALAPA',PTO:'PUERTO',CD:'CIUDAD',CDMX:'MEXICO',CMX:'MEXICO',SLP:'SANLUISPOTOSI',COAH:'COAHUILA',
 CUU:'CHIHUAHUA',TIJ:'TIJUANA',JUA:'JUAREZ',VER:'VERACRUZ',MXL:'MEXICALI',HMO:'HERMOSILLO',
 ALLSUPER:'ALSUPER',CRYSTAL:'CRISTAL',AV:'AVENIDA',STA:'SANTA',SN:'SAN'};
function mNorm(x){
  x=String(x==null?'':x).toUpperCase();
  const a='ÁÉÍÓÚÜÑ', b='AEIOUUN';
  for(let i=0;i<a.length;i++) x=x.split(a[i]).join(b[i]);
  return x.replace(/[^A-Z0-9 ]/g,' ');
}
function mToks(x){ return mNorm(x).split(/\s+/).filter(t=>t&&!M_STOP[t]).map(t=>M_SYN[t]||t); }
function mRatio(a,b){                       // similitud por bigramas
  if(a===b) return 1;
  if(a.length<2||b.length<2) return 0;
  const g=s=>{const m={};for(let i=0;i<s.length-1;i++){const k=s.substr(i,2);m[k]=(m[k]||0)+1;}return m;};
  const A=g(a),B=g(b); let hit=0,ta=a.length-1,tb=b.length-1;
  for(const k in A) if(B[k]) hit+=Math.min(A[k],B[k]);
  return 2*hit/(ta+tb);
}
let M_FREQ=null;
function mFreq(){
  if(M_FREQ) return M_FREQ;
  M_FREQ={};
  STORES.forEach(s=>{ const v={}; mToks(s.nm).forEach(t=>v[t]=1); for(const t in v) M_FREQ[t]=(M_FREQ[t]||0)+1; });
  return M_FREQ;
}
function sugerirPDV(nombre, n){
  const qt=mToks(nombre), qf=qt.join(''), QS={}; qt.forEach(t=>QS[t]=1);
  const out=STORES.map(s=>{
    const tt=mToks(s.nm), tf=tt.join('');
    if(!qt.length||!tt.length) return {sc:0,s:s};
    let inter=0, uni={}; qt.forEach(t=>uni[t]=1); tt.forEach(t=>{ if(QS[t]) inter++; uni[t]=1; });
    const j=inter/Object.keys(uni).length;
    const ratio=mRatio(qf,tf)*0.96;
    const mn=Math.min(qf.length,tf.length), mx=Math.max(qf.length,tf.length);
    const cont=((qf.indexOf(tf)>=0||tf.indexOf(qf)>=0)&&mn>=8&&mn/mx>=0.62)?0.94:0;
    let sub=0;
    if(inter>=2&&Math.min(qt.length,tt.length)>=2)
      sub=inter/Math.min(qt.length,tt.length)*0.90*(0.6+0.4*inter/Math.max(qt.length,tt.length));
    return {sc:Math.max(j,ratio,cont,sub), s:s};
  }).sort((a,b)=>b.sc-a.sc);
  return out.slice(0, n||4);
}
function nombresSinClave(){
  const m={};
  DB.rec.forEach(r=>{ if(r.e==='ASIGNADO'&&r.p&&!r.c) m[r.p]=(m[r.p]||0)+1; });
  DB.ent.forEach(r=>{ if(r.p&&!r.c&&r.p.indexOf('SOBRANTE')<0) m[r.p]=(m[r.p]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function vincularNombre(nombre, store){
  let k=0;
  DB.rec.forEach(r=>{ if(r.p===nombre&&!r.c){ r.p=store.nm; r.c=store.cv; k++; } });
  DB.ent.forEach(r=>{ if(r.p===nombre&&!r.c){ r.p=store.nm; r.c=store.cv; k++; } });
  logIt('"'+nombre+'" quedó vinculado a '+store.nm+' ['+store.cv+'] en '+k+' registro(s).','EDICION');
  save(); return k;
}
function modalVincular(nombre){
  const sug=sugerirPDV(nombre,4);
  const cuantos=DB.rec.filter(r=>r.p===nombre&&!r.c).length+DB.ent.filter(r=>r.p===nombre&&!r.c).length;
  let elegido=null;
  openModal('<div class="mhead"><div><h2>Vincular con el directorio</h2>'+

    '<div class="mbody">'+
      '<label class="f">Tiendas más parecidas</label>'+
      '<div class="radios" style="flex-direction:column" id="vSug">'+
        sug.map((x,i)=>'<label data-cv="'+esc(x.s.cv)+'" style="min-width:0"><b>'+esc(x.s.nm)+'</b>'+
          '<span>'+esc(x.s.cv)+' · '+esc(x.s.rg)+' · CC '+esc(x.s.cc)+' · parecido '+Math.round(x.sc*100)+'%</span></label>').join('')+
      '</div>'+
      '<div class="field" style="margin-top:16px"><label class="f">O busca otra tienda</label><div id="vCbox"></div></div>'+
      '<p class="hint">Si la tienda ya cerró y no está en el directorio, deja el nombre como está y cierra esta ventana.</p>'+

  const marca=cv=>{ elegido=SBYCV[cv]||null;
    document.querySelectorAll('#vSug label').forEach(l=>l.classList.toggle('on',l.dataset.cv===cv));
    $('#vOk').disabled=!elegido; $('#vHint').textContent=elegido?'Se vinculará a '+elegido.nm:'Elige una tienda para vincular.'; };
  document.querySelectorAll('#vSug label').forEach(l=>l.onclick=()=>marca(l.dataset.cv));
  buildCombo('#vCbox', st=>{ if(st) marca(st.cv); });
  $('#vOk').onclick=()=>{ const k=vincularNombre(nombre,elegido); closeModal(); render(); toast(k+' registro(s) vinculados a '+elegido.nm); };

function kpi(c,l,v,s){ return '<div class="kpi '+c+'"><div class="lab">'+esc(l)+'</div><div class="val">'+v+'</div><div class="sub">'+esc(s)+'</div></div>'; }
function seg(v,t,color,lab){ const p=v/t*100; return '<div style="flex:'+v+';background:'+color+'" title="'+lab+': '+v+'">'+(p>7?v:'')+'</div>'; }
function pct(v,t){ return t? (Math.round(v/t*1000)/10)+'%' : '0%'; }

/* ============================================================
   ALMACÉN / ASIGNADOS  (equipos recibidos)
   ============================================================ */
function baseRows(){
  const onlyPend = S.view==='almacen';
  const f=S.f, q=f.q.trim().toUpperCase();
  return DB.rec.filter(r=>{
    if(onlyPend && r.e!=='PENDIENTE') return false;
    if(S.view==='asignados' && r.e!=='ASIGNADO') return false;
    if(f.tipo!=='TODOS' && r.t!==f.tipo) return false;
    if(f.modelo && r.m!==f.modelo) return false;
    if(f.lote && (r.l||'Sin lote')!==f.lote) return false;
    if(f.est!=='TODOS' && r.a!==f.est) return false;
    if(f.sc && r.c) return false;
    if(q){
      const hay=(r.s+' '+r.p+' '+r.c+' '+r.k+' '+r.m+' '+r.l+' '+r.r+' '+r.n).toUpperCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}
function vStock(){
  const alm = S.view==='almacen';
  const rows = baseRows();
  const modelos=[...new Set(DB.rec.map(r=>r.m).filter(Boolean))].sort();
  const lotes=[...new Set(DB.rec.map(r=>r.l||'Sin lote'))].sort();

  $('#vActions').innerHTML =
    '<button class="btn" id="aAlta">Registrar recepción</button>'+
    '<button class="btn" id="aExp">Exportar vista (CSV)</button>';

  const totalP = Math.max(1, Math.ceil(rows.length/S.size));
  if(S.page>totalP) S.page=totalP;
  const slice = S.size===0? rows : rows.slice((S.page-1)*S.size, S.page*S.size);

  $('#view').innerHTML =
  '<div class="filters">'+
    '<div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
      '<input class="inp" id="fq" placeholder="Buscar serie, PDV, clave, ticket o lote…" value="'+esc(S.f.q)+'"></div>'+
    '<div class="chipset" id="fTipo">'+['TODOS','BIOMETRICO','PINPAD'].map(t=>'<button data-v="'+t+'" class="'+(S.f.tipo===t?'on':'')+'">'+(t==='TODOS'?'Todos':t==='BIOMETRICO'?'Biométricos':'Pinpads')+'</button>').join('')+'</div>'+
    '<select class="mini" id="fModelo"><option value="">Todos los modelos</option>'+modelos.map(m=>'<option '+(S.f.modelo===m?'selected':'')+'>'+esc(m)+'</option>').join('')+'</select>'+
    '<select class="mini" id="fLote"><option value="">Todos los lotes</option>'+lotes.map(m=>'<option '+(S.f.lote===m?'selected':'')+'>'+esc(m)+'</option>').join('')+'</select>'+
    (alm?'':'<button class="btn sm" id="fSc" style="'+(S.f.sc?'border-color:var(--ochre);background:var(--ochre-soft);color:var(--ochre);font-weight:600':'')+'">Sin clave de PDV</button>')+
    (alm?'':'<select class="mini" id="fEst"><option value="TODOS">Cualquier asignación</option>'+ASIGS.map(a=>'<option '+(S.f.est===a?'selected':'')+'>'+a+'</option>').join('')+'</select>')+
    '<button class="btn sm" id="fClear">Limpiar</button>'+
  '</div>'+
  (rows.length===0 ? emptyBox(alm?'El almacén está vacío con estos filtros':'No hay equipos asignados con estos filtros','Ajusta la búsqueda o registra una nueva recepción.')
  : '<div class="tablewrap"><table><thead><tr>'+
      '<th style="width:34px"><input type="checkbox" class="ck" id="ckAll"></th>'+
      '<th>Serie</th><th>Tipo</th><th>Modelo</th><th>Lote</th><th>Recepción</th><th>Estatus</th>'+
      '<th>PDV asignado</th><th>Clave PDV</th><th>Ticket Prime</th><th>Asignación</th><th>Serie reemplazada</th><th>Notas</th><th></th>'+
    '</tr></thead><tbody id="tb">'+ slice.map(rowHtml).join('') +'</tbody></table></div>'+
    pagerHtml(rows.length, totalP))+
  selbarHtml();

  wireStock(rows, slice);
}
function rowHtml(r){
  const sel=S.sel.has(r.i);
  return '<tr class="'+(sel?'sel':'')+'" data-i="'+r.i+'">'+
    '<td><input type="checkbox" class="ck rk" data-i="'+r.i+'" '+(sel?'checked':'')+'></td>'+
    '<td class="serie">'+esc(r.s)+'</td>'+
    '<td><span class="tipo '+(r.t==='BIOMETRICO'?'bio':'pin')+'">'+(r.t==='BIOMETRICO'?'BIO':'PIN')+'</span></td>'+
    '<td>'+esc(r.m||'—')+'</td><td>'+esc(r.l||'—')+'</td><td>'+fdate(r.f)+'</td>'+
    '<td>'+(r.e==='ASIGNADO'?'<span class="b ok">Asignado</span>':'<span class="b pend">Pendiente</span>')+'</td>'+
    '<td class="wrapcell">'+(r.p?esc(r.p):'<span class="hint">'+esc(r.g||'Almacén')+'</span>')+'</td>'+
    '<td class="serie">'+(r.c? esc(r.c) : (r.e==='ASIGNADO'?'<button class="b pend" data-vinc="'+esc(r.p)+'" style="cursor:pointer" title="Vincular con el directorio">Sin clave</button>':'—'))+'</td>'+
    '<td class="serie">'+esc(r.k||'—')+'</td>'+
    '<td>'+(r.a?'<span class="b n">'+esc(r.a)+'</span>':'—')+'</td>'+
    '<td class="serie">'+esc(r.r||'—')+'</td>'+
    '<td class="wrapcell hint">'+esc(r.n||'')+'</td>'+
    '<td><button class="btn sm" data-edit="'+r.i+'">Editar</button></td>'+
  '</tr>';
}
function pagerHtml(n,totalP){
  return '<div class="pager"><span>'+n+' equipo'+(n===1?'':'s')+' en la vista</span>'+
    '<span class="sp">Mostrar <select class="mini" id="pSize" style="padding:3px 6px">'+
      [50,100,200,500].map(s=>'<option '+(S.size===s?'selected':'')+'>'+s+'</option>').join('')+
      '<option value="0" '+(S.size===0?'selected':'')+'>Todos</option></select>'+
      (S.size?'<button class="btn sm" id="pPrev" '+(S.page<=1?'disabled':'')+'>‹</button>'+
      '<span>Página '+S.page+' de '+totalP+'</span>'+
      '<button class="btn sm" id="pNext" '+(S.page>=totalP?'disabled':'')+'>›</button>':'')+
    '</span></div>';
}
function selbarHtml(){
  if(!S.sel.size) return '';
  const alm=S.view==='almacen';
  return '<div class="selbar"><span class="n">'+S.sel.size+'</span><span class="lbl">equipo'+(S.sel.size===1?'':'s')+' seleccionado'+(S.sel.size===1?'':'s')+'</span>'+
    '<span class="sp">'+
      '<button class="btn pri" id="sAsig">'+(alm?'Asignar a un PDV':'Reasignar')+'</button>'+
      '<button class="btn" id="sRec">Editar recepción</button>'+
      (alm?'':'<button class="btn" id="sTicket">Cambiar ticket</button><button class="btn" id="sDes">Regresar al almacén</button>')+
      '<button class="btn" id="sEnt">Enviar a AT&amp;T</button>'+
      '<button class="btn" id="sCmp">Comprobante</button>'+
      '<button class="btn" id="sExp">Exportar</button>'+

}
function emptyBox(t,s){ return '<div class="card"><div class="empty"><b>'+esc(t)+'</b>'+esc(s)+'</div></div>'; }

function wireStock(rows, slice){
  const q=$('#fq');
  if(q){ q.oninput=()=>{ S.f.q=q.value; S.page=1; const p=q.selectionStart; vStock(); const n=$('#fq'); n.focus(); n.setSelectionRange(p,p); }; }
  document.querySelectorAll('#fTipo button').forEach(b=>b.onclick=()=>{S.f.tipo=b.dataset.v;S.page=1;vStock()});
  const fm=$('#fModelo'); if(fm) fm.onchange=()=>{S.f.modelo=fm.value;S.page=1;vStock()};
  const fl=$('#fLote'); if(fl) fl.onchange=()=>{S.f.lote=fl.value;S.page=1;vStock()};
  const fs=$('#fSc'); if(fs) fs.onclick=()=>{S.f.sc=!S.f.sc;S.page=1;vStock()};
  const fe=$('#fEst'); if(fe) fe.onchange=()=>{S.f.est=fe.value;S.page=1;vStock()};
  const fc=$('#fClear'); if(fc) fc.onclick=()=>{S.f={tipo:'TODOS',est:'TODOS',modelo:'',lote:'',q:'',sc:false};S.page=1;vStock()};
  const ps=$('#pSize'); if(ps) ps.onchange=()=>{S.size=parseInt(ps.value,10)||0;S.page=1;vStock()};
  const pp=$('#pPrev'); if(pp) pp.onclick=()=>{S.page--;vStock()};
  const pn=$('#pNext'); if(pn) pn.onclick=()=>{S.page++;vStock()};
  const aa=$('#aAlta'); if(aa) aa.onclick=modalAlta;
  const ae=$('#aExp'); if(ae) ae.onclick=()=>exportRec(rows,'inventario');

  const ckAll=$('#ckAll');
  if(ckAll){
    ckAll.checked = slice.length>0 && slice.every(r=>S.sel.has(r.i));
    ckAll.onclick=()=>{ if(ckAll.checked) slice.forEach(r=>S.sel.add(r.i)); else slice.forEach(r=>S.sel.delete(r.i)); vStock(); };
  }
  document.querySelectorAll('.rk').forEach((c,idx)=>{
    c.onclick=(ev)=>{
      const i=c.dataset.i;
      if(ev.shiftKey && S.lastIdx!==null){
        const [a,b]=[Math.min(S.lastIdx,idx),Math.max(S.lastIdx,idx)];
        for(let k=a;k<=b;k++) S.sel.add(slice[k].i);
      } else { if(S.sel.has(i)) S.sel.delete(i); else S.sel.add(i); }
      S.lastIdx=idx; vStock();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>modalEdit(b.dataset.edit));
  document.querySelectorAll('[data-vinc]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); modalVincular(b.dataset.vinc); });

  const on=(id,fn)=>{ const e=$(id); if(e) e.onclick=fn; };
  on('#sAsig', ()=>modalAsignar([...S.sel]));
  on('#sDes',  ()=>{ const n=S.sel.size; [...S.sel].forEach(i=>{ const r=DB.rec.find(x=>x.i===i); if(r){ r.e='PENDIENTE'; r.p='';r.c='';r.k='';r.a='';r.r='';r.fa=''; } });
      logIt(n+' equipo(s) regresaron al almacén.','ASIGNACION'); S.sel.clear(); save(); render(); toast(n+' equipo(s) regresaron al almacén'); });
  on('#sTicket', ()=>modalTicket([...S.sel]));
  on('#sRec', ()=>modalRecep([...S.sel]));
  on('#sEnt',  ()=>modalEnviarATT([...S.sel]));
  on('#sCmp',  ()=>{ const it=[...S.sel].map(i=>DB.rec.find(r=>r.i===i)).filter(Boolean);
    modalCmp(null,{nm:'', tp:S.view==='almacen'?'RECEPCION EN ALMACEN':'ENVIO A PDV', f:today(),
      l:it[0]?it[0].l:'', ss:it.map(r=>r.s), k:it[0]?it[0].k:''}); });
  on('#sExp',  ()=>exportRec(DB.rec.filter(r=>S.sel.has(r.i)),'seleccion'));
  on('#sClr',  ()=>{ S.sel.clear(); vStock(); });
}

/* ============================================================
   MODAL: asignación masiva
   ============================================================ */
let M = {};
function openModal(html, cls){
  const o=document.createElement('div'); o.className='ovl'; o.id='ovl';
  o.innerHTML='<div class="modal '+(cls||'')+'">'+html+'</div>';
  o.onclick=(e)=>{ if(e.target===o) closeModal(); };
  document.body.appendChild(o);
  document.body.style.overflow='hidden';
  const x=o.querySelector('.x'); if(x) x.onclick=closeModal;
  return o;
}
function closeModal(){ const o=$('#ovl'); if(o) o.remove(); document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function modalAsignar(ids){
  const items = ids.map(i=>DB.rec.find(r=>r.i===i)).filter(Boolean);
  if(!items.length) return;
  M = { store:null, tipo:'REEMPLAZO', ticketMode:'uno', ticket:'', fecha:today(), notas:'', items:items.map(r=>({i:r.i,s:r.s,t:r.t,m:r.m,k:r.k||'',r:r.r||'',n:r.n||''})), regEnt:true };

  openModal(
    '<div class="mhead"><div><h2>Asignar '+items.length+' equipo'+(items.length===1?'':'s')+'</h2>'+
      '<p>Elige el punto de venta y el tipo de movimiento. Puedes capturar un ticket por equipo o el mismo para todos.</p></div>'+
      '<button class="x">&times;</button></div>'+
    '<div class="mbody">'+
      '<div class="field"><label class="f">Punto de venta destino</label><div id="cbox"></div></div>'+
      '<div class="field"><label class="f">Tipo de asignación</label>'+
        '<div class="radios" id="rAsig">'+
          radio('REEMPLAZO','Reemplazo','Sustituye a un equipo existente')+
          radio('NUEVA POSICION','Nueva posición','Se agrega una posición de venta')+
          radio('EXPANSION','Expansión','Tienda nueva o ampliación')+
        '</div></div>'+
      '<div class="row">'+
        '<div class="field"><label class="f">Fecha de asignación</label><input type="date" class="inp" id="aFecha" value="'+today()+'"></div>'+
        '<div class="field"><label class="f">Ticket Prime</label>'+
          '<div style="display:flex;gap:6px"><input class="inp" id="aTicket" placeholder="Ej. 203302"><select class="mini" id="aTMode" style="max-width:150px"><option value="uno">Mismo para todos</option><option value="cada">Uno por equipo</option></select></div></div>'+
      '</div>'+
      '<div class="field"><label class="f">Notas (se aplican a todos, editables por equipo)</label><input class="inp" id="aNotas" placeholder="Opcional"></div>'+
      '<div id="repBox"></div>'+
      '<label class="f" style="margin-top:14px">Detalle por equipo</label>'+
      '<div style="max-height:260px;overflow:auto"><table class="itable" id="itbl"></table></div>'+
    '</div>'+
    '<div class="mfoot"><span class="hint" id="aHint">Selecciona un punto de venta para continuar.</span>'+
      '<span class="sp"><button class="btn" onclick="closeModal()">Cancelar</button>'+
      '<button class="btn pri" id="aOk" disabled>Confirmar asignación</button></span></div>', 'wide');

  buildCombo('#cbox', st=>{ M.store=st; refreshAsig(); });
  document.querySelectorAll('#rAsig label').forEach(l=>l.onclick=()=>{ M.tipo=l.dataset.v; refreshAsig(); });
  $('#aTicket').oninput=e=>{ M.ticket=e.target.value.trim(); if(M.ticketMode==='uno') M.items.forEach(it=>it.k=M.ticket); refreshItems(); validAsig(); };
  $('#aTMode').onchange=e=>{ M.ticketMode=e.target.value; if(M.ticketMode==='uno') M.items.forEach(it=>it.k=M.ticket); refreshItems(); validAsig(); };
  $('#aFecha').onchange=e=>M.fecha=e.target.value;
  $('#aNotas').oninput=e=>{ M.notas=e.target.value; M.items.forEach(it=>it.n=M.notas); refreshItems(); };
  $('#aOk').onclick=doAsignar;
  refreshAsig();
}
function radio(v,t,s){ return '<label data-v="'+v+'" class="'+(v==='REEMPLAZO'?'on':'')+'"><b>'+t+'</b><span>'+s+'</span></label>'; }
function refreshAsig(){
  document.querySelectorAll('#rAsig label').forEach(l=>l.classList.toggle('on', l.dataset.v===M.tipo));
  $('#repBox').innerHTML = M.tipo==='REEMPLAZO'
    ? '<div class="warnbox"><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">'+
      '<input type="checkbox" class="ck" id="aRegEnt" '+(M.regEnt?'checked':'')+'>'+
      '<span><b>Registrar las series reemplazadas como pendientes de entregar a AT&amp;T.</b><br>'+
      'Cada serie vieja que captures abajo se dará de alta en la pestaña de entregados con estatus <i>Pendiente de entregar</i>.</span></label></div>' : '';
  const re=$('#aRegEnt'); if(re) re.onchange=e=>M.regEnt=e.target.checked;
  refreshItems(); validAsig();
}
function refreshItems(){
  const rep = M.tipo==='REEMPLAZO';
  const perTicket = M.ticketMode==='cada';
  $('#itbl').innerHTML =
    '<thead><tr><th style="width:30px">#</th><th>Serie nueva</th><th style="width:70px">Tipo</th>'+
    (perTicket?'<th style="width:130px">Ticket</th>':'')+
    (rep?'<th style="width:190px">Serie a reemplazar</th>':'')+
    '<th>Notas</th></tr></thead><tbody>'+
    M.items.map((it,ix)=>'<tr><td class="hint">'+(ix+1)+'</td><td class="sn">'+esc(it.s)+'</td>'+
      '<td><span class="tipo '+(it.t==='BIOMETRICO'?'bio':'pin')+'">'+(it.t==='BIOMETRICO'?'BIO':'PIN')+'</span></td>'+
      (perTicket?'<td><input data-k="k" data-x="'+ix+'" value="'+esc(it.k)+'" placeholder="Ticket"></td>':'')+
      (rep?'<td><input data-k="r" data-x="'+ix+'" value="'+esc(it.r)+'" placeholder="Serie que sale"></td>':'')+
      '<td><input data-k="n" data-x="'+ix+'" value="'+esc(it.n)+'" placeholder="Opcional"></td></tr>').join('')+
    '</tbody>';
  document.querySelectorAll('#itbl input').forEach(inp=>{
    inp.oninput=()=>{ M.items[+inp.dataset.x][inp.dataset.k]=inp.value; validAsig(); };
  });
}
function validAsig(){
  const ok = !!M.store && (M.ticketMode==='uno' ? !!M.ticket : M.items.every(i=>i.k.trim()));
  const btn=$('#aOk'); if(btn) btn.disabled=!ok;
  const h=$('#aHint');
  if(h) h.textContent = !M.store ? 'Selecciona un punto de venta para continuar.'
    : !ok ? 'Falta capturar el ticket Prime.'
    : M.items.length+' equipo(s) → '+M.store.nm;
}
function doAsignar(){
  const nuevos=[];
  M.items.forEach(it=>{
    const r=DB.rec.find(x=>x.i===it.i); if(!r) return;
    r.e='ASIGNADO'; r.p=M.store.nm; r.c=M.store.cv; r.k=(M.ticketMode==='uno'?M.ticket:it.k).trim();
    r.a=M.tipo; r.n=it.n.trim(); r.fa=M.fecha;
    r.r = M.tipo==='REEMPLAZO' ? it.r.trim() : '';
    if(M.tipo==='REEMPLAZO' && M.regEnt && r.r){
      const id=nid('E',DB.ent.concat(nuevos));
      nuevos.push({i:id,t:r.t,l:'',m:r.m,s:r.r,p:M.store.nm,c:M.store.cv,f:'',k:r.k,e:'PENDIENTE',n:'Retirado al asignar la serie '+r.s,fa:''});
    }
  });
  if(nuevos.length) DB.ent = nuevos.concat(DB.ent);
  logIt(M.items.length+' equipo(s) asignados a '+M.store.nm+' ['+M.store.cv+'] · '+M.tipo+' · ticket '+(M.ticketMode==='uno'?M.ticket:'individual')+(nuevos.length?' · '+nuevos.length+' serie(s) vieja(s) por entregar':'')+'. Series: '+M.items.map(i=>i.s).join(', ')+'.','ASIGNACION');
  save(); S.sel.clear(); closeModal(); render();
  toast(M.items.length+' equipo(s) asignados a '+M.store.nm + (nuevos.length? ' · '+nuevos.length+' serie(s) por entregar a AT&T':''));
}

/* ---------- combobox de PDV ---------- */
function buildCombo(sel, onPick, preset){
  const host=$(sel); let picked=preset||null, hi=0, list=[];
  function paint(){
    if(picked){
      host.innerHTML='<div class="picked"><div><b>'+esc(picked.nm)+'</b>'+
        '<span>'+esc(picked.cv)+' · '+esc(picked.rg)+' · CC '+esc(picked.cc)+(picked.gt?' · '+esc(picked.gt):'')+'</span></div>'+
        '<button type="button">Cambiar</button></div>';
      host.querySelector('button').onclick=()=>{ picked=null; onPick(null); paint(); setTimeout(()=>{const i=host.querySelector('input'); if(i) i.focus();},0); };
      return;
    }
    host.innerHTML='<div class="combo"><input class="inp" placeholder="Escribe nombre de tienda, clave PDV, host o región…" autocomplete="off"><div class="list" style="display:none"></div></div>';
    const inp=host.querySelector('input'), box=host.querySelector('.list');
    function search(){
      const q=inp.value.trim().toUpperCase();
      list = (q? STORES.filter(s=>(s.nm+' '+s.cv+' '+s.hn+' '+s.rg+' '+s.cc).toUpperCase().indexOf(q)>=0) : STORES).slice(0,60);
      hi=0;
      box.style.display = list.length? 'block':'none';
      box.innerHTML=list.map((s,ix)=>'<div data-x="'+ix+'" class="'+(ix===hi?'hi':'')+'"><b>'+esc(s.nm)+'</b><span>'+esc(s.cv)+' · '+esc(s.rg)+'</span></div>').join('');
      box.querySelectorAll('div[data-x]').forEach(d=>d.onmousedown=(e)=>{e.preventDefault(); pick(list[+d.dataset.x]);});
    }
    function pick(s){ picked=s; onPick(s); paint(); }
    inp.oninput=search; inp.onfocus=search;
    inp.onblur=()=>setTimeout(()=>{ if(box) box.style.display='none'; },150);
    inp.onkeydown=e=>{
      if(e.key==='ArrowDown'){ hi=Math.min(hi+1,list.length-1); }
      else if(e.key==='ArrowUp'){ hi=Math.max(hi-1,0); }
      else if(e.key==='Enter'){ e.preventDefault(); if(list[hi]) pick(list[hi]); return; }
      else return;
      e.preventDefault();
      box.querySelectorAll('div[data-x]').forEach((d,ix)=>d.classList.toggle('hi',ix===hi));
      const el=box.querySelector('.hi'); if(el) el.scrollIntoView({block:'nearest'});
    };
  }
  paint();
}

function modalAlta(){
  openModal('<div class="mhead"><div><h2>Registrar recepción</h2>'+
    '<p>Carga de golpe todas las series que te lleguen. Entran al almacén como pendientes por asignar y no se toca nada de lo ya capturado.</p></div><button class="x">&times;</button></div>'+
    '<div class="mbody">'+
      '<label class="f">Datos por omisión</label>'+
      '<p class="hint" style="margin:-2px 0 8px">Se usan cuando el pegado no trae esa columna.</p>'+
      '<div class="row"><div class="field"><label class="f">Tipo de equipo</label><select class="inp" id="nT"><option>BIOMETRICO</option><option>PINPAD</option></select></div>'+
      '<div class="field"><label class="f">Modelo</label><input class="inp" id="nM" value="MSO331" placeholder="MSO331 / LANE 3000 / SP30"></div>'+
      '<div class="field"><label class="f">Lote</label><input class="inp" id="nL" placeholder="Ej. LOTE 350"></div></div>'+
      '<div class="row"><div class="field"><label class="f">Fecha de recepción</label><input type="date" class="inp" id="nF" value="'+today()+'"></div>'+
      '<div class="field"><label class="f">Almacén</label><input class="inp" id="nG" value="ALMACEN TOLUCA"></div></div>'+
      '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">'+
      '<div class="field"><label class="f">Series recibidas</label>'+
        '<textarea class="inp" id="nS" rows="8" placeholder="Pega aquí las series.\n\nAcepta una serie por línea, o columnas copiadas de Excel:\nBIOMETRICOS\tMSO331\t2544S001145\nBIOMETRICOS\tMSO331\t2550S001758"></textarea></div>'+
      '<div class="row" style="align-items:center"><div class="field" style="margin:0"><label class="f">O carga un archivo</label>'+
        '<input type="file" class="inp" id="nFile" accept=".csv,.tsv,.txt,.xlsx,.xls"></div>'+
        '<span class="hint" style="flex:2;min-width:200px">Excel (.xlsx) o CSV. Se lee la primera hoja y se ignora el renglón de encabezados.</span></div>'+
      '<div id="nPrev" style="margin-top:14px"></div>'+
    '</div>'+
    '<div class="mfoot"><span class="hint" id="nHint">Pega las series o carga un archivo para ver la vista previa.</span>'+
      '<span class="sp"><button class="btn" onclick="closeModal()">Cancelar</button>'+
      '<button class="btn pri" id="nOk" disabled>Registrar en almacén</button></span></div>', 'wide');

  let filas=[];
  const TIPO_BIO=/^(BIOMETRIC[OA]S?|BIO|HUELLA|LECTOR)$/i;
  const TIPO_PIN=/^(PIN\s?PADS?|PINPADS?|PIN|TERMINAL)$/i;
  const MODELO=/^(MSO\s?-?\s?33\d|LANE\s?\/?\s?3000|SP\s?-?\s?30|PAX(\s?SP\s?30)?|D\s?200)$/i;
  const FECHA=/^\d{1,4}[\/\-]\d{1,2}[\/\-]\d{1,4}$/;
  const ENCABEZADO=/(SERIE|SERIAL|MODELO|TIPO|EQUIPO|LOTE|FECHA|CANTIDAD|N[UÚ]MERO)/i;

  function analizar(){
    const txt=$('#nS').value;
    const defT=$('#nT').value, defM=$('#nM').value.trim();
    const enSistema=new Set(DB.rec.map(r=>r.s).concat(DB.ent.map(r=>r.s)));
    const vistas=new Set();
    filas=[];
    txt.split(/\r?\n/).forEach(linea=>{
      const celdas=linea.split(/[\t,;|]+/).map(c=>c.trim().replace(/^["']|["']$/g,'')).filter(Boolean);
      if(!celdas.length) return;
      let tipo='', modelo='', cands=[];
      celdas.forEach(c=>{
        if(TIPO_BIO.test(c)){ tipo='BIOMETRICO'; return; }
        if(TIPO_PIN.test(c)){ tipo='PINPAD'; return; }
        if(MODELO.test(c)){ modelo=c.toUpperCase().replace(/\s+/g,' '); return; }
        if(FECHA.test(c)) return;
        cands.push(c);
      });
      // la serie es el candidato más largo con pinta de número de serie
      const serie=cands.filter(c=>/\d/.test(c) && /^[A-Za-z0-9][A-Za-z0-9\-\/]{4,}$/.test(c)).sort((a,b)=>b.length-a.length)[0];
      if(!serie){
        if(celdas.some(c=>ENCABEZADO.test(c)) || !cands.length) return;   // encabezado o renglón sin serie
        filas.push({s:celdas.join(' ').slice(0,40), estado:'INVALIDA'}); return;
      }
      if(!tipo) tipo = (/^\d{18,}$/.test(serie) ? 'PINPAD' : defT);
      if(!modelo) modelo = defM || (tipo==='PINPAD'?'LANE 3000':'MSO331');
      let estado='NUEVA';
      if(enSistema.has(serie)) estado='EN_SISTEMA';
      else if(vistas.has(serie)) estado='REPETIDA';
      vistas.add(serie);
      filas.push({s:serie, t:tipo, m:modelo, estado:estado});
    });
    pintar();
  }
  function pintar(){
    const n=c=>filas.filter(f=>f.estado===c).length;
    const nuevas=n('NUEVA'), enSis=n('EN_SISTEMA'), rep=n('REPETIDA'), mal=n('INVALIDA');
    if(!filas.length){ $('#nPrev').innerHTML=''; $('#nHint').textContent='Pega las series o carga un archivo para ver la vista previa.'; $('#nOk').disabled=true; return; }
    const probs=[];
    if(enSis) probs.push(enSis+' ya en el sistema');
    if(rep) probs.push(rep+' repetida(s) en el pegado');
    if(mal) probs.push(mal+' renglón(es) sin serie válida');
    $('#nPrev').innerHTML=
      '<div class="'+(nuevas?'okbox':'warnbox')+'"><b>'+nuevas+' serie(s) nuevas por registrar.</b>'+
      (probs.length?' Se omiten: '+probs.join(', ')+'.':' No hay repetidas.')+'</div>'+
      '<div style="max-height:230px;overflow:auto"><table class="itable"><thead><tr><th style="width:34px">#</th><th>Serie</th><th style="width:110px">Tipo</th><th style="width:120px">Modelo</th><th style="width:150px">Estado</th></tr></thead><tbody>'+
      filas.slice(0,200).map((f,ix)=>'<tr><td class="hint">'+(ix+1)+'</td><td class="sn">'+esc(f.s)+'</td>'+
        '<td>'+(f.t?'<span class="tipo '+(f.t==='BIOMETRICO'?'bio':'pin')+'">'+(f.t==='BIOMETRICO'?'BIO':'PIN')+'</span>':'—')+'</td>'+
        '<td>'+esc(f.m||'—')+'</td><td>'+
        (f.estado==='NUEVA'?'<span class="b ok">Nueva</span>':
         f.estado==='EN_SISTEMA'?'<span class="b pend">Ya existe</span>':
         f.estado==='REPETIDA'?'<span class="b pend">Repetida</span>':'<span class="b n">Sin serie</span>')+
        '</td></tr>').join('')+'</tbody></table></div>'+
      (filas.length>200?'<p class="hint" style="margin-top:6px">Se muestran los primeros 200 de '+filas.length+' renglones.</p>':'');
    $('#nHint').textContent = nuevas? nuevas+' equipo(s) entrarán al almacén.' : 'No hay series nuevas por registrar.';
    $('#nOk').disabled = !nuevas;
  }

  $('#nS').oninput=analizar;
  $('#nT').onchange=analizar; $('#nM').oninput=analizar;
  $('#nFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    try{
      if(ext==='xlsx'||ext==='xls'){
        const X=await cargarXLSX();
        const wb=X.read(await f.arrayBuffer(),{type:'array'});
        $('#nS').value=X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:'\t'});
        toast('Hoja "'+wb.SheetNames[0]+'" cargada');
      } else {
        $('#nS').value=await f.text();
        toast('Archivo cargado');
      }
      analizar();
    }catch(err){
      toast(ext==='xlsx'||ext==='xls' ? 'No se pudo leer el Excel. Guárdalo como CSV e inténtalo de nuevo.' : 'No se pudo leer el archivo', true);
    }
    e.target.value='';
  };
  $('#nOk').onclick=()=>{
    const nuevas=filas.filter(f=>f.estado==='NUEVA');
    if(!nuevas.length){ toast('No hay series nuevas por registrar',true); return; }
    const l=normalizarLote($('#nL').value), f=$('#nF').value, g=$('#nG').value.trim();
    nuevas.forEach(x=>DB.rec.push({i:nid('R',DB.rec),t:x.t,l:l,m:x.m,s:x.s,g:g,f:f,p:'',c:'',k:'',e:'PENDIENTE',a:'',r:'',n:'',fa:''}));
    const om=filas.length-nuevas.length;
    const porTipo={}; nuevas.forEach(x=>porTipo[x.t]=(porTipo[x.t]||0)+1);
    logIt('Recepción registrada: '+Object.entries(porTipo).map(([k,v])=>v+' '+k.toLowerCase()+'(s)').join(', ')+
      ', lote '+(l||'sin lote')+(om?' · '+om+' renglón(es) omitidos por repetidos o inválidos':'')+'.','ALTA');
    save(); closeModal(); go('almacen');
    toast(nuevas.length+' equipo(s) agregados al almacén'+(om?' · '+om+' omitidos':''));
  };
}
function cargarXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX) return res(window.XLSX);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('sin XLSX'));
    sc.onerror=()=>rej(new Error('sin red'));
    document.head.appendChild(sc);
  });
}

function entRows(){
  const f=S.fe, q=f.q.trim().toUpperCase();
  return DB.ent.filter(r=>{
    if(f.tipo!=='TODOS' && r.t!==f.tipo) return false;
    if(f.est!=='TODOS' && r.e!==f.est) return false;
    if(q && (r.s+' '+r.p+' '+r.c+' '+r.k+' '+r.l+' '+r.m+' '+r.n).toUpperCase().indexOf(q)<0) return false;
    return true;
  });
}

const TIPOS_CMP=['ENTREGA A AT&T','RECEPCION EN ALMACEN','ENVIO A PDV','OTRO'];
const IMG_KEY=i=>'pmx_img_'+i;

function comprimir(file, maxLado, calidad){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('lectura'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('imagen'));
      im.onload=()=>{
        const esc=Math.min(1,maxLado/Math.max(im.width,im.height));
        const w=Math.max(1,Math.round(im.width*esc)), h=Math.max(1,Math.round(im.height*esc));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
        res({url:c.toDataURL('image/jpeg',calidad), w:w, h:h});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function guardarFoto(file){
  const full=await comprimir(file,1500,.78);
  const th=await comprimir(file,300,.6);
  const id='F'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const path=APP_USER.id+'/'+id+'.jpg';
  const raw=atob(full.url.split(',')[1]);
  const bytes=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  const up=await CENTRAL.storage.from('comprobantes').upload(path,new Blob([bytes],{type:'image/jpeg'}),{contentType:'image/jpeg',upsert:false});
  if(up.error) throw up.error;
  return {id:path, th:th.url, kb:Math.round(bytes.length/1024), w:full.w, h:full.h, nom:file.name||'foto.jpg'};
}
async function leerFoto(id){
  try{
    if(String(id).indexOf('/')>=0){
      const r=await CENTRAL.storage.from('comprobantes').download(id);
      return r.error?null:URL.createObjectURL(r.data);
    }
    const r=await window.storage.get(IMG_KEY(id)); return r&&r.value;
  }catch(e){ return null; }
}
async function borrarFotos(fotos){
  const rem=(fotos||[]).map(f=>f.id).filter(id=>String(id).indexOf('/')>=0);
  if(rem.length){ try{ await CENTRAL.storage.from('comprobantes').remove(rem); }catch(e){} }
  for(const f of (fotos||[]).filter(f=>String(f.id).indexOf('/')<0)){ try{ await window.storage.delete(IMG_KEY(f.id)); }catch(e){} }
}

    '<div class="field"><label class="f">Rol</label><select class="inp" id="uRole"><option value="CONSULTA">Consulta — solo lectura</option><option value="CAPTURA">Captura — registra y edita</option><option value="ADMIN">Administrador — control total</option></select></div>'+
    '<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="uActivo" '+(!u||u.activo?'checked':'')+'> Acceso activo</label></div>'+
    '<div class="mfoot"><span class="hint">El usuario creará su propia contraseña.</span><span class="sp"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="uGuardar">Guardar usuario</button></span></div>');
  $('#uRole').value=u&&u.role||'CONSULTA';
  $('#uGuardar').onclick=async()=>{
    const email=$('#uEmail').value.trim().toLowerCase(), nombre=$('#uNombre').value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email)){ toast('Captura un correo válido',true); return; }
    $('#uGuardar').disabled=true;
    const r=await CENTRAL.from('allowed_users').upsert({email:email,nombre:nombre,role:$('#uRole').value,activo:$('#uActivo').checked},{onConflict:'email'});
    if(r.error){ $('#uGuardar').disabled=false; toast('No se pudo guardar el usuario: '+r.error.message,true); return; }
    logIt((edit?'Permisos actualizados para ':'Usuario autorizado: ')+email+'.','SISTEMA'); save();
    closeModal(); vUsuarios(); toast('Usuario guardado');
  };
}

function exportJSON(){
  const payload={sistema:'Control de biométricos y pinpads PrimeMX', version:SEED_V, exportado:new Date().toISOString(),
    equipos:DB.rec.length, entregados:DB.ent.length, rec:DB.rec, ent:DB.ent, log:DB.log, cmp:DB.cmp||[]};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));
  a.download='respaldo_biometricos_pinpads_'+today()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  logIt('Respaldo descargado en archivo .json.','RESPALDO'); save();
  toast('Respaldo descargado');
}
function exportTodo(){
  exportRec(DB.rec,'inventario_completo');
  setTimeout(()=>exportEnt(DB.ent,'entregados_att_completo'),350);
  setTimeout(()=>csv(['Fecha','Hora','Categoría','Movimiento'],
    DB.log.map(l=>{const dt=new Date(l.d);return [dt.toLocaleDateString('es-MX'),dt.toLocaleTimeString('es-MX'),CATS[l.c]||l.c||'Sistema',l.t]}),'bitacora_completa'),700);
  logIt('Exportación completa a CSV.','RESPALDO'); save();
}
function importJSON(file){
  const rd=new FileReader();
  rd.onload=async()=>{
    let b;
    try{ b=JSON.parse(rd.result); }catch(e){ toast('El archivo no es un respaldo válido',true); return; }
    if(!Array.isArray(b.rec)||!Array.isArray(b.ent)){ toast('El archivo no tiene el formato del sistema',true); return; }
    if(!confirm('El respaldo contiene '+b.rec.length+' equipos y '+b.ent.length+' salidas a AT&T'+
      (b.exportado?' (exportado el '+new Date(b.exportado).toLocaleString('es-MX')+')':'')+
      '.\n\nSe reemplazará todo lo capturado. ¿Continuar?')) return;
    await makeBackup('manual','Antes de importar archivo');
    DB={sv:SEED_V, rec:b.rec, ent:b.ent, log:b.log||[], cmp:b.cmp||[]};
    normalizarDBLotes(DB);
    logIt('Datos importados desde archivo ('+b.rec.length+' equipos, '+b.ent.length+' salidas).','RESPALDO');
    S.sel.clear(); S.esel.clear(); save(); render(); toast('Respaldo importado');
  };
  rd.readAsText(file);
}
function doReset(){
  if(!confirm('Se borrarán todos los cambios capturados y volverán los datos originales del Excel. ¿Continuar?')) return;
  makeBackup('manual','Antes de restablecer').then(()=>{
    seedDB(); S.sel.clear(); S.esel.clear(); save(); render(); toast('Datos restablecidos');
  });
}

/* ============================================================

   ============================================================ */
function csv(cols, rows, name){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const txt='\uFEFF'+[cols.map(q).join(',')].concat(rows.map(r=>r.map(q).join(','))).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=name+'_'+today()+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('Archivo descargado');
}
function exportRec(rows,name){
  csv(['Lote','Tipo','Modelo','Serie','Almacén','Fecha de recepción','PDV asignado','Clave PDV','Ticket Prime','Estatus','Asignación','Serie a reemplazar','Fecha de asignación','Notas'],
    rows.map(r=>[r.l,r.t,r.m,r.s,r.g,r.f,r.p,r.c,r.k,r.e==='ASIGNADO'?'ASIGNADO':'PENDIENTE POR ASIGNAR',r.a,r.r,r.fa,r.n]), name);
}
function exportEnt(rows,name){
  csv(['Lote','Tipo','Modelo','Serie','PDV de origen','Clave PDV','Fecha de entrega a AT&T','Ticket Prime','Estatus','Notas'],
    rows.map(r=>[r.l,r.t,r.m,r.s,r.p,r.c,r.f,r.k,r.e==='ENTREGADO'?'ENTREGADO A AT&T':'PENDIENTE DE ENTREGAR',r.n]), name);
}

function authMessage(msg,err){ const e=$('#authMsg'); e.textContent=msg||''; e.className='authmsg'+(err?' err':''); }
function showAuth(msg,err){
  $('#app').classList.remove('ready'); $('#authGate').classList.remove('hidden');
  if(msg) authMessage(msg,err);
}
function authError(e){
  const m=String((e&&e.message)||e||'');
  if(/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/email not confirmed/i.test(m)) return 'Confirma el correo desde el mensaje que te envió el sistema.';
  if(/already registered/i.test(m)) return 'Ese correo ya tiene cuenta. Usa Entrar.';
  return 'No se pudo completar el acceso. '+m;
}
async function enterApp(user){
  APP_USER=user;
  const p=await CENTRAL.from('profiles').select('user_id,email,nombre,role,activo').eq('user_id',user.id).maybeSingle();
  if(p.error || !p.data || !p.data.activo){
    await CENTRAL.auth.signOut(); APP_USER=null; APP_PROFILE=null;
    showAuth('Tu correo todavía no está autorizado. Pide al administrador que lo habilite.',true); return;
  }
  APP_PROFILE=p.data;
  $('#userEmail').textContent=p.data.nombre||p.data.email||user.email;
  $('#userRole').textContent=p.data.role.toLowerCase();
  authMessage('Cargando base central…');
  try{
    await load();
    $('#authGate').classList.add('hidden'); $('#app').classList.add('ready');
    render(); startCentralPolling();
  }catch(e){ showAuth('No se pudo cargar la base central. Verifica tu conexión e intenta de nuevo.',true); }
}
let pollT=null;
function startCentralPolling(){
  clearInterval(pollT);
  pollT=setInterval(async()=>{
    if(!APP_USER || saving) return;
    const r=await CENTRAL.from('app_state').select('version').eq('id',1).single();
    if(r.error) return;
    const remoto=Number(r.data.version||0);
    if(remoto>SERVER_VERSION){
      if(dirty){ centralConflict=true; storageOK=false; setSaveState(); toast('Hay cambios nuevos en la base central. Recarga antes de continuar.',true); }
      else{ try{ await load(); render(); toast('Base actualizada con los cambios más recientes.'); }catch(e){} }
    }
  },20000);
}
$('#authForm').onsubmit=async e=>{
  e.preventDefault();
  if(!CENTRAL){ authMessage('No se cargó la conexión central. Revisa internet y recarga.',true); return; }
  const email=$('#authEmail').value.trim().toLowerCase(), password=$('#authPass').value;
  $('#authLogin').disabled=true; authMessage('Validando acceso…');
  const r=await CENTRAL.auth.signInWithPassword({email,password});
  $('#authLogin').disabled=false;
  if(r.error){ authMessage(authError(r.error),true); return; }
  await enterApp(r.data.user);
};
$('#authSignup').onclick=async()=>{
  if(!CENTRAL){ authMessage('No se cargó la conexión central. Revisa internet y recarga.',true); return; }
  const email=$('#authEmail').value.trim().toLowerCase(), password=$('#authPass').value;
  if(!email || password.length<8){ authMessage('Captura un correo válido y una contraseña de al menos 8 caracteres.',true); return; }
  $('#authSignup').disabled=true; authMessage('Creando acceso…');
  const r=await CENTRAL.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});
  $('#authSignup').disabled=false;
  if(r.error){ authMessage(authError(r.error),true); return; }
  authMessage(r.data.session?'Cuenta creada. Validando autorización…':'Cuenta creada. Revisa tu correo para confirmarla.');
  if(r.data.session) await enterApp(r.data.user);
};
$('#btnLogout').onclick=async()=>{ clearInterval(pollT); await CENTRAL.auth.signOut(); APP_USER=null; APP_PROFILE=null; showAuth('Sesión cerrada.'); };
document.addEventListener('click',e=>{
  if(canWrite()) return;
  const b=e.target.closest('button'); if(!b) return;
  const mut=/^(nuevo|guardar|aplicar|asignar|desasignar|enviar|recibir|registrar|editar|eliminar|borrar|quitar|agregar|vincular|restablecer|importar|confirmar|mover|actualizar|corregir)/i;
  if(mut.test(b.textContent.trim())){ e.preventDefault(); e.stopImmediatePropagation(); toast('Tu perfil es de consulta; no puede modificar la base.',true); }
},true);
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
(async function(){
  if(!CENTRAL){ showAuth('No se pudo iniciar la conexión central. Revisa internet y recarga.',true); return; }
  const r=await CENTRAL.auth.getSession();
  if(r.data.session) await enterApp(r.data.session.user); else showAuth();
})();
